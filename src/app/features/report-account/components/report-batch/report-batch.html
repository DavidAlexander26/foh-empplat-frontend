<div class="table-container max-h-[500px] overflow-auto">
    <table mat-table [dataSource]="dataSource" matSort class="w-[1400px]" >
        <ng-container matColumnDef="numeroLote">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Número del Lote</th>
            <td mat-cell *matCellDef="let element">{{ element.numeroLote }}</td>
        </ng-container>
        
        <ng-container matColumnDef="fechaCarga">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha de carga</th>
            <td mat-cell *matCellDef="let element">{{ element.fechaCarga }}</td>
        </ng-container>
        
        <ng-container matColumnDef="horaCarga">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Hora de carga</th>
            <td mat-cell *matCellDef="let element">{{ element.horaCarga }}</td>
        </ng-container>
        
        <ng-container matColumnDef="registrosTotal">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Registros totales</th>
            <td mat-cell *matCellDef="let element">{{ element.registrosTotal }}</td>
        </ng-container>
        
        <ng-container matColumnDef="registrosCompleto">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Registros completos</th>
            <td mat-cell *matCellDef="let element">{{ element.registrosCompleto }}</td>
        </ng-container>
        
        <ng-container matColumnDef="registrosObservado">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Registros Observados</th>
            <td mat-cell *matCellDef="let element">{{ element.registrosObservado }}</td>
        </ng-container>
        
        <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
            <td mat-cell *matCellDef="let element">
                <mat-chip [ngClass]="getEstadoClass(element.estado)">
                {{ element.estado }}
                </mat-chip>
            </td>
        </ng-container>
        <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let element">
                <button
                mat-icon-button
                [matMenuTriggerFor]="menu"
                (click)="$event.stopPropagation()"
                >
                <mat-icon>more_vert</mat-icon>
                </button>

                <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="descargarFila(element)">
                    <mat-icon>save_alt</mat-icon>
                    <span>Descargar archivo</span>
                </button>
                </mat-menu>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
</div>
<mat-paginator [length]="totalRecords()" [pageSize]="size()" [pageIndex]="page()"
    [pageSizeOptions]="pageSizeOptions" aria-label="Seleccionar página">
</mat-paginator>
