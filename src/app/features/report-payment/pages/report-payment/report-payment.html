<section class="payment-section">
    <foh-back-button text="Volver al inicio" route="/inicio" />
    <foh-grid class="payment-body">
        <foh-col [xs]="12">
            <mat-card appearance="outlined" outlined-outline-color="white"
                class="p-[3px] bg-white flex flex-col gap-[16px]">
                <h2 class="text-[2.4rem] font-[500] text-[#333333] leading-[var(--line-height-tight)]">
                    Reporte de pago de haberes
                </h2>
                <div class="flex items-center">
                    <p class="text-[#6B7280] text-[16px] font-[400] leading-[var(--line-height-tight)]">
                        Listado completo de los pagos de haberes para análisis y autoría
                    </p>
                </div>
            </mat-card>
        </foh-col>
        <foh-col [xs]="12">
          <mat-card appearance="outlined" outlined-outline-color="white" class="p-[36px] bg-white">
              <h2 class="text-[2.4rem] font-[500] text-[#333333] leading-[var(--line-height-tight)]">
                Filtros de búsqueda
              </h2>
              <mat-card-actions class="flex items-end filter-box w-full" [style.padding]="0">
                <div class="flex flex-wrap filter-filters">
                  <mat-form-field appearance="outline" class="filter-filter">
                    <mat-label>Estado</mat-label>
                    <mat-select [(ngModel)]="statusFilter" placeholder="Seleccione estado">
                      <mat-option value="noAutorizadas">No autorizadas</mat-option>
                      <mat-option value="autorizadas">Autorizadas</mat-option>
                      <mat-option value="todas">Todas</mat-option>
                    </mat-select>
                  </mat-form-field>

                  <mat-form-field appearance="outline" class="filter-filter">
                    <mat-label>Lote</mat-label>
                    <input
                      matInput
                      type="text"
                      [(ngModel)]="batchFilter"
                      placeholder="Ingrese lote"
                    />
                  </mat-form-field>

                  <mat-form-field appearance="outline" class="filter-filter">
                    <mat-label>DNI</mat-label>
                    <input
                      matInput
                      type="text"
                      [(ngModel)]="dniFilter"
                      placeholder="Ingrese DNI"
                    />
                  </mat-form-field>

                  <div class="flex gap-[16px] filter-filter">

                    <mat-form-field appearance="outline" class="w-full">
                      <mat-label>Fecha inicio</mat-label>
                      <input
                        matInput
                        [matDatepicker]="pickerStart"
                        [(ngModel)]="dateFilter.start"
                        [max]="today"

                      >
                      <mat-datepicker-toggle matIconSuffix [for]="pickerStart"></mat-datepicker-toggle>
                      <mat-datepicker #pickerStart></mat-datepicker>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="w-full">
                      <mat-label>Fecha fin</mat-label>
                      <input
                        matInput
                        [matDatepicker]="pickerEnd"
                        [(ngModel)]="dateFilter.end"
                        [min]="dateFilter.start"
                        [max]="today"

                      >
                      <mat-datepicker-toggle matIconSuffix [for]="pickerEnd"></mat-datepicker-toggle>
                      <mat-datepicker #pickerEnd></mat-datepicker>
                    </mat-form-field>

                  </div>

                </div>
                <div class="flex filter-item">
                  <button
                    type="button"
                    mat-button
                    matButton="text"
                    (click)="clearFilters()"
                  >
                    Limpiar filtros
                  </button>
                  <button
                    mat-flat-button
                    matButton="filled"
                    (click)="search()"
                  >
                    Buscar
                  </button>
                </div>

              </mat-card-actions>
          </mat-card>
        </foh-col>

        <foh-col [xs]="12">
            <mat-card appearance="outlined">
                <mat-card-header class="flex-wrap justify-between">
                    <mat-card-title>Tabla de pagos</mat-card-title>
                    <div class="download-div">
                      <button type="button" mat-button matButton="text" (click)="exportToPDF()">
                          <span class="flex download-span">
                              <span class="leading-[var(--line-height-tight)] download-text">Descargar a pdf</span>
                              <svg fill="none" stroke="currentColor" class="text-[#1A73E8] download-icon">
                                  <use [attr.href]="'/icons/sprites.svg#download'" />
                              </svg>
                          </span>
                      </button>
                      <button type="button" mat-button matButton="text" (click)="exportToExcel()">
                          <span class="flex download-span">
                              <span class="leading-[var(--line-height-tight)] download-text">Descargar a excel</span>
                              <svg fill="none" stroke="currentColor" class="text-[#1A73E8] download-icon">
                                  <use [attr.href]="'/icons/sprites.svg#download'" />
                              </svg>
                          </span>
                      </button>
                    </div>
                </mat-card-header>
                <mat-card-content [style.padding]="0">
                    <app-payment-table></app-payment-table>
                </mat-card-content>
            </mat-card>
        </foh-col>
    </foh-grid>
</section>
